<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Animations and Transitions | WDD 231</title>
    <style>
        body {
            font-family: system-ui, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 3rem;
            padding: 2rem;
            background: #1a1a2e;
            color: #eee;
        }

        h1 { margin-bottom: 0; }
        h2 { color: #ccc; }

        /* ========== 1. Loading Animation ========== */
        #loader {
            margin: 2rem;
            width: 50px;
            height: 50px;
            border: 5px solid transparent;
            border-color: #999 transparent #999 transparent;
            border-radius: 50%;
            animation: spin 1.5s linear infinite;
            box-shadow: 0 0 1rem rgb(0 0 255 / 40%);
            position: relative;
        }

        #loader::after {
            content: '⚙️';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            animation: pulse 1.5s ease-in-out infinite;
        }

        @keyframes spin {
            100% { transform: rotate(360deg); }
        }

        @keyframes pulse {
            0%, 100% { transform: translate(-50%, -50%) scale(1); }
            50% { transform: translate(-50%, -50%) scale(1.25); }
        }

        /* ========== 2. Transition on Hover ========== */
        .loader-t {
            width: 50px;
            height: 50px;
            border: 5px solid transparent;
            border-color: #999 transparent #999 transparent;
            border-radius: 50%;
            box-shadow: 0 0 1rem rgb(0 0 255 / 40%);
            position: relative;
            transition: transform 1.5s ease-in-out;
        }

        .loader-t::after {
            content: '⚙️';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0);
            transition: transform 1.5s ease-in-out;
            font-size: 2rem;
        }

        .loader-t:hover {
            transform: rotate(360deg);
        }

        .loader-t:hover::after {
            transform: translate(-50%, -50%) scale(1.5);
        }
    </style>
</head>
<body>
    <h1>CSS Animations and Transitions</h1>

    <section>
        <h2>1. Loading Animation (animation + @keyframes)</h2>
        <div id="loader"></div>
    </section>

    <section>
        <h2>2. Hover Transition (transition)</h2>
        <p>Hover over the circle below:</p>
        <div id="loader-t" class="loader-t"></div>
    </section>
</body>
</html>
